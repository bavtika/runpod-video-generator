# Local orchestration for the AI Video Studio client (CPU/light).
# GPU video generation runs on RunPod Serverless — not in this compose file.

services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-content-studio:local
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./outputs:/app/outputs
      - ./music:/app/music
      - ./temp_assets:/app/temp_assets
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
